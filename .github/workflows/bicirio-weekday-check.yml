name: BiciRio one-time weekday bicycle availability check

on:
  # One-time target: Monday 2026-11-16 at 09:15 Colombia (UTC-5).
  # This is 14:15 UTC / 15:15 in the Netherlands (CET).
  # GitHub cron has no year; the date guard and self-disable prevent repetition.
  schedule:
    - cron: "15 14 16 11 *"
  workflow_dispatch:
  push:
    paths:
      - "tools/check_bicirio_weekday.py"
      - "tools/tests/test_bicirio_weekday.py"
      - ".github/workflows/bicirio-weekday-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write # Disable only this scheduled research workflow after its run.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate the check script offline
        run: |
          python -m compileall -q tools/check_bicirio_weekday.py
          python -m unittest discover -s tools/tests -p 'test_bicirio_weekday.py' -v

      - name: Run only on the requested date (or manual dispatch)
        if: github.event_name != 'push'
        id: date_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ||
                "$(date -u +%F)" == "2026-11-16" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "This one-time check is only scheduled for 2026-11-16."
          fi

      - name: Recheck BiciRio stations and available bicycle records
        if: steps.date_guard.outputs.run == 'true'
        run: python tools/check_bicirio_weekday.py --output bicirio-weekday-report.json

      - name: Save result even when availability is empty or fails
        if: always() && steps.date_guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bicirio-weekday-2026-11-16
          path: bicirio-weekday-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Disable this one-time workflow after scheduled run
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/bicirio-weekday-check.yml/disable"
          echo "Scheduled one-time workflow disabled."
