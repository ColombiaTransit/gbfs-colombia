name: Inspect BiciRio public website assets

on:
  # One-time weekday availability check: 2026-11-16 09:00 America/Bogota.
  # GitHub cron uses UTC (14:00 UTC). The job date guard prevents annual reruns.
  schedule:
    - cron: "0 14 16 11 *"
  workflow_dispatch:
  push:
    paths:
      - "tools/research_bicirio.py"
      - ".github/workflows/research-bicirio.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Guard one-time scheduled check
        id: date_guard
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "$(date -u +%F)" == "2026-11-16" ]]; then
            echo "execute=true" >> "$GITHUB_OUTPUT"
          else
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled check is only for 2026-11-16; no future annual probe."
          fi
      - uses: actions/checkout@v4
        if: steps.date_guard.outputs.execute == 'true'
      - name: Inspect public official website assets only
        if: steps.date_guard.outputs.execute == 'true'
        env:
          BICIRIO_PUBLIC_RESEARCH_TLS_FALLBACK: "1"
        run: python tools/research_bicirio.py | tee bicirio-public-assets.txt
      - name: Preserve public research summary
        if: steps.date_guard.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bicirio-public-assets
          path: bicirio-public-assets.txt
          retention-days: 7
