name: EnCicla Tor connectivity probe

on:
  workflow_dispatch:
    inputs:
      endpoint_url:
        description: 'Full public HTTPS GetDisponibilidadMapas endpoint URL (optional when ENCICLA_PROBE_URL repo variable is configured)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Tor and Python SOCKS support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tor
          python -m pip install --disable-pip-version-check 'requests[socks]>=2.32,<3'
          sudo systemctl start tor
          for attempt in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/9050) 2>/dev/null; then
              echo "Tor SOCKS port ready"
              exit 0
            fi
            sleep 2
          done
          echo 'Tor SOCKS port was not ready' >&2
          exit 1
      - name: Compare direct and Tor
        env:
          ENCICLA_INPUT_URL: ${{ inputs.endpoint_url }}
          ENCICLA_DEFAULT_URL: ${{ vars.ENCICLA_PROBE_URL }}
        run: |
          export ENCICLA_PROBE_URL="${ENCICLA_INPUT_URL:-$ENCICLA_DEFAULT_URL}"
          if [[ -z "$ENCICLA_PROBE_URL" ]]; then
            echo 'Provide endpoint_url when starting this workflow or set the ENCICLA_PROBE_URL repository variable.' >&2
            exit 2
          fi
          python scripts/probe_encicla_tor.py --output artifacts/encicla-tor-probe.json
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encicla-tor-probe
          path: artifacts/encicla-tor-probe.json
          if-no-files-found: ignore
          retention-days: 14
