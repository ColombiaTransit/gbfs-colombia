name: BiciRio live adapter smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/smoke_bicirio_scraper.py"
      - ".github/workflows/bicirio-live-dry-run.yml"

permissions:
  contents: read
  packages: read

jobs:
  live-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest validated GBFS image
        run: docker pull ghcr.io/colombiatransit/gbfs-colombia:latest
      - name: One-time official public API read (no feed publishing)
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/tools/smoke_bicirio_scraper.py:/tmp/smoke_bicirio.py:ro" \
            --entrypoint python \
            ghcr.io/colombiatransit/gbfs-colombia:latest \
            /tmp/smoke_bicirio.py
