name: Build and publish GBFS Colombia

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "colombia_gbfs/**"
      - "config/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/container.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/colombiatransit/gbfs-colombia
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      - name: Build, test and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker Compose runtime
        if: github.event_name != 'pull_request'
        env:
          GBFS_IMAGE: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
        run: |
          docker compose pull
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8000/healthz; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          for service in publisher subscriber api; do
            container_id=$(docker compose ps -q "$service")
            test -n "$container_id"
            test "$(docker inspect -f '{{.State.Running}}' "$container_id")" = "true"
          done
          docker compose ps

      - name: Show Compose logs on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GBFS_IMAGE: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
        run: docker compose logs --tail 80

      - name: Stop smoke test containers
        if: always() && github.event_name != 'pull_request'
        env:
          GBFS_IMAGE: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
        run: docker compose down -v
