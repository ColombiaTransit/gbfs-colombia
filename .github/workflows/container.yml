name: Build and publish GBFS Colombia

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "colombia_gbfs/**"
      - "config/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/container.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/colombiatransit/gbfs-colombia
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag

      # Push only the immutable sha- tag here. latest and v* tags are
      # promoted after the Compose smoke test passes (see below).
      - name: Build, test and push candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker Compose runtime
        if: github.event_name != 'pull_request'
        env:
          GBFS_IMAGE: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
          GBFS_CONTACT_EMAIL: ci@example.invalid
        run: |
          docker compose pull
          docker compose up -d
          # Probe from a separate container on the shared network: no host ports.
          probe() {
            docker run --rm \
              --network "${GBFS_SHARED_NETWORK:-gbfs-colombia-shared}" \
              --entrypoint python "$GBFS_IMAGE" \
              -c 'import urllib.request; urllib.request.urlopen("http://gbfs-colombia:8000/healthz", timeout=3)'
          }
          for attempt in $(seq 1 30); do
            if probe; then
              break
            fi
            sleep 2
          done
          probe
          # The GBFS app itself must answer, not only the liveness route.
          docker run --rm \
            --network "${GBFS_SHARED_NETWORK:-gbfs-colombia-shared}" \
            --entrypoint python "$GBFS_IMAGE" \
            -c 'import json, urllib.request; json.load(urllib.request.urlopen("http://gbfs-colombia:8000/3/manifest.json", timeout=5))["data"]["datasets"]'
          # Enforce that Docker has not bound any API port on the host.
          test "$(docker inspect -f '{{len .HostConfig.PortBindings}}' "$(docker compose ps -q api)")" = "0"
          for service in publisher subscriber api; do
            container_id=$(docker compose ps -q "$service")
            test -n "$container_id"
            test "$(docker inspect -f '{{.State.Running}}' "$container_id")" = "true"
          done
          docker compose ps

      - name: Promote tested image tags
        if: github.event_name != 'pull_request'
        env:
          SOURCE: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$SOURCE" ]; then
              docker buildx imagetools create --tag "$tag" "$SOURCE"
            fi
          done <<< "$TAGS"

      - name: Show Compose logs on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GBFS_IMAGE: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
        run: docker compose logs --tail 80

      - name: Stop smoke test containers
        if: always() && github.event_name != 'pull_request'
        env:
          GBFS_IMAGE: ghcr.io/colombiatransit/gbfs-colombia:sha-${{ github.sha }}
        run: docker compose down -v
