name: Research Rueda por Ibague Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/research_ibague_apk.py"
      - ".github/workflows/research-ibague-apk.yml"

permissions:
  contents: read

jobs:
  static-apk-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research script
        uses: actions/checkout@v4
      - name: Check script syntax
        run: python -m py_compile tools/research_ibague_apk.py
      - name: Inspect public APK listing and available APK (static only)
        run: python tools/research_ibague_apk.py
      - name: Preserve limited findings JSON, never APK binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibague-apk-static-research
          path: ibague-apk-analysis.json
          if-no-files-found: warn
          retention-days: 14
