name: EnCicla Azure Function test and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to existing Azure Function App (requires configured OIDC credentials)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline tests and syntax validation
        run: |
          python -m unittest discover -s azure/encicla-probe/tests -v
          python -m compileall -q azure/encicla-probe

  deploy:
    needs: test
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to existing Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.ENCICLA_AZURE_FUNCTION_APP }}
          package: azure/encicla-probe
          remote-build: true
