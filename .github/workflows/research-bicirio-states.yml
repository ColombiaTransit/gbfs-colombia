name: Research BiciRio bicycle state categories

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/inspect_bicirio_state_strings.py"
      - ".github/workflows/research-bicirio-states.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Test aggregate classification and sanitization locally
        run: |
          python -m compileall -q tools/check_bicirio_weekday.py tools/inspect_bicirio_state_strings.py
          python -m unittest discover -s tools/tests -p 'test_bicirio_weekday.py' -v
      - name: Research-only public availability category distribution
        run: |
          python tools/check_bicirio_weekday.py --output bicirio-state-research.json
      - name: Inspect public frontend status labels
        if: always()
        env:
          BICIRIO_PUBLIC_RESEARCH_TLS_FALLBACK: "1"
        run: |
          python -m tools.inspect_bicirio_state_strings > bicirio-js-state-hints.txt
          sed -n '1,65p' bicirio-js-state-hints.txt
      - name: Store only aggregated states and public code hints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bicirio-public-bicycle-state-research
          path: |
            bicirio-state-research.json
            bicirio-js-state-hints.txt
          if-no-files-found: warn
          retention-days: 7
