name: gbfs-colombia

x-image: &gbfs-image ${GBFS_IMAGE:-ghcr.io/colombiatransit/gbfs-colombia:latest}

services:
  migrate:
    image: *gbfs-image
    command: ["python", "-m", "citybikes.cmd.migrate"]
    environment:
      DB_URI: /data/citybikes.db
    volumes:
      - gbfs-data:/data
    networks:
      - backend
    restart: "no"

  publisher:
    image: *gbfs-image
    command: ["python", "-m", "colombia_gbfs.publisher"]
    # Optional .env passthrough, e.g. PYBIKES_<MODULE> keys for authed adapters.
    env_file:
      - path: .env
        required: false
    environment:
      ENABLED_NETWORKS: ${ENABLED_NETWORKS:-encicla,tembici-bogota}
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-180}
      # Portainer stack variables are Compose substitutions, not automatically
      # injected into the publisher container. Pass only the EnCicla settings.
      ENCICLA_PROXY_URL: ${ENCICLA_PROXY_URL:-}
      ENCICLA_FUNCTION_KEY: ${ENCICLA_FUNCTION_KEY:-}
      ZMQ_LISTEN: tcp://0.0.0.0:5555
      N_WORKERS_PYBIKES: "4"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  subscriber:
    image: *gbfs-image
    command: ["python", "-m", "citybikes.cmd.subscriber"]
    environment:
      DB_URI: /data/citybikes.db
      ZMQ_ADDR: tcp://publisher:5555
    volumes:
      - gbfs-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      publisher:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  api:
    image: *gbfs-image
    # Optional .env passthrough, so GBFS_OPENING_HOURS_<TAG> works for any
    # enabled network without editing this file.
    env_file:
      - path: .env
        required: false
    environment:
      DB_URI: /data/citybikes.db
      ENABLED_NETWORKS: ${ENABLED_NETWORKS:-encicla,tembici-bogota}
      GBFS_CONTACT_EMAIL: ${GBFS_CONTACT_EMAIL:-}
      GBFS_OPENING_HOURS: "${GBFS_OPENING_HOURS:-24/7 unknown}"
    # No host port is published. Other containers (e.g. OTP) reach the API
    # on the existing external network as http://gbfs-colombia:8000.
    expose:
      - "8000"
    networks:
      gbfs-shared:
        aliases:
          - gbfs-colombia
    volumes:
      - gbfs-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# The backend network stays private to this Compose project. Do not mark it
# internal: publisher needs outbound access to the original bike providers.
networks:
  backend:
  # Existing network shared with other stacks on this host. It is not
  # created or removed by this project; it must exist before `up`.
  gbfs-shared:
    external: true
    name: ${GBFS_SHARED_NETWORK:-traefik_default}

volumes:
  gbfs-data:
