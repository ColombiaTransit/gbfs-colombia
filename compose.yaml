name: gbfs-colombia

x-image: &gbfs-image ${GBFS_IMAGE:-ghcr.io/colombiatransit/gbfs-colombia:latest}

services:
  migrate:
    image: *gbfs-image
    command: ["python", "-m", "citybikes.cmd.migrate"]
    environment:
      DB_URI: /data/citybikes.db
    volumes:
      - gbfs-data:/data
    networks:
      - backend
    labels:
      traefik.enable: "false"
    restart: "no"

  publisher:
    image: *gbfs-image
    command: ["python", "-m", "colombia_gbfs.publisher"]
    environment:
      ENABLED_NETWORKS: ${ENABLED_NETWORKS:-encicla,tembici-bogota}
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-180}
      ZMQ_LISTEN: tcp://0.0.0.0:5555
      N_WORKERS_PYBIKES: "4"
    networks:
      - backend
    labels:
      traefik.enable: "false"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  subscriber:
    image: *gbfs-image
    command: ["python", "-m", "citybikes.cmd.subscriber"]
    environment:
      DB_URI: /data/citybikes.db
      ZMQ_ADDR: tcp://publisher:5555
    volumes:
      - gbfs-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      publisher:
        condition: service_started
    networks:
      - backend
    labels:
      traefik.enable: "false"
    restart: unless-stopped

  api:
    image: *gbfs-image
    environment:
      DB_URI: /data/citybikes.db
      ENABLED_NETWORKS: ${ENABLED_NETWORKS:-encicla,tembici-bogota}
      GBFS_CONTACT_EMAIL: ${GBFS_CONTACT_EMAIL:-}
      GBFS_OPENING_HOURS: "${GBFS_OPENING_HOURS:-24/7 unknown}"
      GBFS_OPENING_HOURS_ENCICLA: "${GBFS_OPENING_HOURS_ENCICLA:-}"
      GBFS_OPENING_HOURS_TEMBICI_BOGOTA: "${GBFS_OPENING_HOURS_TEMBICI_BOGOTA:-}"
    # No host port is published. Traefik and OTP use the shared Docker network.
    expose:
      - "8000"
    networks:
      shared:
        aliases:
          - gbfs-colombia
    labels:
      traefik.enable: "${GBFS_TRAEFIK_ENABLED:-false}"
      traefik.docker.network: "${GBFS_SHARED_NETWORK:-gbfs-colombia-shared}"
      traefik.http.routers.gbfs-colombia.rule: "Host(`${GBFS_TRAEFIK_HOST:-gbfs.invalid}`)"
      traefik.http.routers.gbfs-colombia.entrypoints: "${GBFS_TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.gbfs-colombia.tls: "true"
      traefik.http.routers.gbfs-colombia.service: "gbfs-colombia"
      traefik.http.services.gbfs-colombia.loadbalancer.server.port: "8000"
    volumes:
      - gbfs-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# The backend network stays private to this Compose project. Do not mark it
# internal: publisher needs outbound access to the original bike providers.
networks:
  backend:
  shared:
    # Predictable name so other Compose projects can attach as external.
    name: ${GBFS_SHARED_NETWORK:-gbfs-colombia-shared}

volumes:
  gbfs-data:
